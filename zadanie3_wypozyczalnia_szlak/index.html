<!DOCTYPE html>
<html lang=pl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Wojceich Maciorowski 4Ei">
    <link rel="stylesheet" href="style.css">
    <title>Szlak - wypożyczalnia</title>
</head>
<body>
    <header>
        <h1>Wypożyczalnia Szlak</h1>
        <a href="#cennik">Cennik</a>
        <a href="#rezerwacja">Rezerwacja</a>
    </header>
    <main>
        <h2>Sprzęt</h2>
        <dl>
            <dt>Namiot 2-os.</dt>
            <dd>40 zł za dobę</dd>
            <dt>Rower trekkingowy</dt>
            <dd>55 zł za dobę</dd>
            <dt>Kajak</dt>
            <dd>70 zł za dobę</dd>
          </dl>
          <h2 id="scennik">Cennik</h2>
          <table>
            <thead>
              <tr>
                <th>Sprzęt</th>
                <th>Doba</th>
                <th>Weekend</th>
              </tr>
              <tr>
                <td>Namiot 2-os.</td>
                <td>40 zł</td>
                <td>70 zł</td>
              </tr>
              <tr>
                <td>Rower trekkingowy </td>
                <td>55 zł</td>
                <td>95 zł</td>
              </tr>
              <tr>
                  <td>Kajak</td>
                  <td>70 zł</td>
                  <td>120 zł</td>
              </tr>
          </table>
          <h2 id="rezerwacja">Rezerwacja</h2>
          <form action="" method="POST">
            <p>
                <label for="imie">Imię</label>
                <input type="text" id="imie" name="imie" placeholder="imie" required />
              </p>
              <p>
                <label for="mail">E-mail</label>
                <input type="email" id="mail" name="mail" />
              </p>
              <p>
                <label for="pakiet">Sprzęt</label>
                <select id="pakiet" name="pakiet">
                  <option value="namiot">Namiot 2-os.</option>
                  <option value="rower">Rower trekkingowy</option>\
                  <option value="kajak">Kajak</option>
                </select>
              </p>
              <p>
                <button type="submit">Zarezerwuj</button>
              </p>
          </form>
    </main>
    <footer>

    </footer>
</body>
</html>
